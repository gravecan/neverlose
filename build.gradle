plugins {
    id 'fabric-loom' version '1.14.10'
    id 'maven-publish'
}

group = 'recovered.chatpaches'
version = '1.0.0-recovered'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1'
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName = 'chatpaches-refmap.json'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

java { withSourcesJar() }

tasks.register('compileRecoveryChecks', JavaCompile) {
    source = fileTree('recovery') { include 'RecoveryUtilityChecks.java' }
    classpath = sourceSets.main.output
    destinationDirectory = layout.buildDirectory.dir('recovery-checks')
}

tasks.register('recoveryChecks', JavaExec) {
    dependsOn 'compileRecoveryChecks'
    classpath = files(layout.buildDirectory.dir('recovery-checks'), sourceSets.main.output)
    mainClass = 'RecoveryUtilityChecks'
}

tasks.named('check') { dependsOn 'recoveryChecks' }
